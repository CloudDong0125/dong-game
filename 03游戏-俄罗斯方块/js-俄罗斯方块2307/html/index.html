<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>俄罗斯方块02</title>
    <style>
        body {
            background-color: #fff;
            text-align: center;
            overflow-x: hidden;
            padding-top: 30px;
        }



        img {
            width: 3rem;
            height: 3rem;
        }

        #canvas {}

        .title {
            width: 100%;
            font-size: 1.2rem;
            height: 4rem;
            line-height: 4rem;
            text-align: center;
            letter-spacing: 0.5rem;
        }

        .button_box {
            display: flex;
            justify-content: space-between;
            width: 18rem;
            line-height: 4rem;
            margin: auto;
        }
    </style>
</head>

<body>
    <div scroll="no" class="container">
        <!-- <div class="title">俄罗斯方块（第二步）</div> -->
        <div class="button_box">
            <div id="clickCreate"><img src="../images/arrow-start.png"></img></div>
            <div>
                <img onClick="clickPorS()" style="display: none" id="btn1" src="../images/arrow-pause.png"></img>
            </div>
        </div>
        <!-- 绘制表格区域 -->
        <canvas id="canvas"></canvas>
        <div class="button_box" style="cursor:pointer;">
            <div style="display: flex; justify-content: space-between;">
                <div id="clickMoveLeft"><img src="../images/arrow-left.png "></img></div>
                <div id="clickMoveRight"><img src="../images/arrow-right.png"></img></div>
            </div>
            <div style="display: flex; justify-content: space-between;">

                <div id="clickTurnLeft"><img src="../images/arrow-roll-left.png"></img></div>
                <div id="clickMoveDown"><img src="../images/arrow-down.png"></img></div>
                <div id="clickTurnRight"><img src="../images/arrow-roll-right.png"></img></div>

            </div>
        </div>
    </div>


    <script>
        let canvas = document.getElementById("canvas")  // 获取画布元素
        let box = canvas.getContext('2d') // 2d效果

        /*
        * 基础配置
        */

        // 整体容器宽高
        canvas.width = 288
        canvas.height = 480


        // 每个格子宽高
        let Width = 24
        let Height = 24

        // 图形
        let curShape
        let currentColor // 颜色
        let isEnd = false
        let isClick = true

        // 初始图形所在位子
        let coorX = 4
        let coorY = 0

        // 当前方向
        let nowDirection


        box.fillStyle = 'black'
        box.fillRect(0, 0, canvas.width, canvas.height)
        box.strokeRect(0, 0, canvas.width, canvas.height)



        let boxArray = [...Array(canvas.width / Width)].map(e => Array(canvas.height / Height).fill(0)) // 二维数组，映射关系
        let boxArrayFlag = [...Array(canvas.width / Width)].map(e => Array(canvas.height / Height).fill(0)) // 标识位二维数组，默认0
        let motionlessArray = [...Array(canvas.width / Width)].map(e => Array(canvas.height / Height).fill(0))
        function restArrayFlag() {
            boxArrayFlag = [...Array(canvas.width / Width)].map(e => Array(canvas.height / Height).fill(0))
        }
        // 七种图形
        let tu_box = [[1, 0], [0, 1], [1, 1], [2, 1]] // 土
        let y_box = [[0, 0], [1, 0], [2, 0], [3, 0]] // 一
        let z_box = [[1, 0], [2, 0], [0, 1], [1, 1]]// 反z
        let tian_box = [[0, 0], [0, 1], [1, 0], [1, 1]] // 田
        let l_box = [[0, 0], [0, 1], [1, 1], [2, 1]] // L
        let i_box = [[0, 1], [0, 0], [1, 0], [2, 0]]  // I一
        let t_box = [[0, 0], [1, 0], [2, 0], [1, 1]] // T

        // 放置同一个数组
        let shapes = [tu_box, y_box, z_box, tian_box, l_box, i_box, t_box]
        let colors = ['red', 'blue', 'orange', 'purple', 'lime', 'teal', 'green'] // 存储的类型为字符串
        // 记录方向
        const DIRECTION = {
            NO: 0,
            LEFT: 1,
            RIGHT: 2,
            DOWN: 3

        }


        /*
        * 主逻辑
        */

        // 构造坐标类
        class Coordinate {
            constructor(x, y) {
                this.x = x
                this.y = y
            }
        }

        document.addEventListener('DOMContentLoaded', initBox)
        // 页面调用
        function initBox() {
            createBoxArray() // 生成数据
            bindClick() // 监听点击事件
        }


        // createBoxArray()
        console.log(boxArray)
        // 生成二维数组
        function createBoxArray() {
            let i = 0, j = 0
            for (let y = 0; y <= canvas.height; y += Height) {  
                for (let x = 0; x <= canvas.width; x += Width) {
                    if (!boxArray[i]) {
                        // console.log(i,j)
                    } else {
                        boxArray[i][j] = new Coordinate(x, y)
                    }
                    i++
                }
                j++
                i = 0
            }
            // console.log(i,j)
            createLine()
        }
        // 创建内部线条
        function createLine() {
            for (let y = 0; y <= canvas.height; y += Height) {
                box.beginPath();
                box.moveTo(0, y);
                box.lineTo(canvas.width, y);
                box.strokeStyle = '#006600';
                box.lineWidth = 1;
                box.stroke();

            }

            for (let x = 0; x <= canvas.width; x += Width) {
                box.beginPath();
                box.moveTo(x, 0);
                box.lineTo(x, canvas.height);
                box.strokeStyle = '#006600';
                box.lineWidth = 1;
                box.stroke();

            }

        }


        // 绘制七种图形
        function drawBoxArray() {
            for (let i = 0; i < curShape.length; i++) {
                let a = curShape[i][0] + coorX
                let b = curShape[i][1] + coorY

                boxArrayFlag[a][b] = 1 // 标识位

                let boxX = boxArray[a][b].x
                let boxY = boxArray[a][b].y
                box.fillStyle = currentColor
                box.fillRect(boxX + 1, boxY + 1, Width - 1, Height - 1)

            }

        }
        // // 随机颜色
        // function getRandomColor() {
        //     this.randomColor = Math.random() * 360
        // }
        // 遍历、清除
        function removeBoxArray() {
            if (!curShape) {
                return false
            }
            for (let i = 0; i < curShape.length; i++) {
                let a = curShape[i][0] + coorX
                let b = curShape[i][1] + coorY

                boxArrayFlag[a][b] = 0 // 标识位

                let boxX = boxArray[a][b].x
                let boxY = boxArray[a][b].y
                box.fillStyle = "black";
                box.fillRect(boxX + 1, boxY + 1, Width - 1, Height - 1)

            }
        }
        // 遍历、清除全部
        function removeAll() {
            if (!curShape) {
                return false
            }
            for (let i = 0; i < boxArray.length; i++) {
                for (let j = 0; j < boxArray[i].length; j++) {
                    let boxX = boxArray[i][j].x
                    let boxY = boxArray[i][j].y
                    box.fillStyle = "black";
                    box.fillRect(boxX + 1, boxY + 1, Width - 1, Height - 1)
                }
            }
            restArrayFlag()
        }
        // 随机取出图形
        function randomBoxArray() {
            let randomIndex = Math.floor(Math.random() * shapes.length) //随机取图形
            let shape = shapes[randomIndex]
            currentColor = colors[randomIndex]
            curShape = shape
        }
        // 检查左右
        function checkLeftRight(shape) {
            let new_curShape = shape || curShape
            //遍历当前图形
            for (let i = 0; i < new_curShape.length; i++) {
                let newX = new_curShape[i][0] + coorX
                if (newX <= 0 && nowDirection === DIRECTION.LEFT) {
                    return true
                } else if (newX >= 11 && nowDirection === DIRECTION.RIGHT) {
                    return true
                } else if (newX < 0 || newX > 11) {
                    return true
                }
            }
            return false
        }
        // 检查底部
        function checkDown() {
            let isTrueBottom = false // 记录是否碰见底部 
            var max = {
                x: 0, y: 0
            }
            let newboxArrayFlag = JSON.parse(JSON.stringify(boxArrayFlag))
            for (let j = 0; j < curShape.length; j++) {
                // 每一个小方块
                const block = curShape[j]
                let x = block[0] + coorX //第0位+默认位子
                let y = block[1] + coorY
                newboxArrayFlag[x][y] = 0 // 标识位
            }
            // checkForComplete() // 填充判断
            for (let j = 0; j < curShape.length; j++) {

                // 每一个小方块
                const block = curShape[j]
                let x = block[0] + coorX //第0位+默认位子
                let y = block[1] + coorY
                // motionlessArray[x][y] = currentColor
                // 方向向下
                if (nowDirection == DIRECTION.DOWN) {
                    y = y + 1
                }
                // 方向向左
                if (nowDirection == DIRECTION.LEFT) {
                    x = x - 1
                }
                // 方向向右
                if (nowDirection == DIRECTION.RIGHT) {
                    x = x + 1
                }
                if (y >= max.y) {
                    max.y = y
                    max.x = x
                }
                // console.log(x)
                // console.log(newboxArrayFlag[x][y])
                if (newboxArrayFlag[x][y] == 1 || newboxArrayFlag[x][y] == undefined || y > ((canvas.height / Height) - 1)) {
                    isTrueBottom = true

                }
            }
            if (isTrueBottom) {
                for (let i = 0; i < curShape.length; i++) {
                    const block = curShape[i]
                    let x = block[0] + coorX
                    let y = block[1] + coorY
                    motionlessArray[x][y] = currentColor
                }
            }
            // // 是否到达底部
            // if ((max.y) > ((canvas.height / Height) - 1)) {
            //     console.log("碰到底部了")
            //     isTrueBottom = true
            //         motionlessArray[max.x][max.y-1] = currentColor

            // }

            return isTrueBottom
        }
        // 检查顶部
        // 旋转图形
        function turnLShape() {

            let shapeCopy = curShape
            let newShape = []

            //遍历每个坐标，变换x，y
            for (let i = 0; i < shapeCopy.length; i++) {
                let x = shapeCopy[i][0]
                let y = shapeCopy[i][1]
                // let newX = getLastX()-y 
                let newX = y
                let newY = 2 - x
                // 填充获取到的新x新y
                newShape.push([newX, newY])
            }
            if (!checkLeftRight(newShape)) {
                removeBoxArray() // 删除
                curShape = newShape
                drawBoxArray() // 重新绘制
            }
        }
        function turnRShape() {

            let shapeCopy = curShape
            let newShape = []

            //遍历每个坐标，变换x，y
            for (let i = 0; i < shapeCopy.length; i++) {
                let x = shapeCopy[i][0]
                let y = shapeCopy[i][1]
                // let newX = getLastX()-y 
                let newX = 2 - y
                let newY = x
                // 填充获取到的新x新y
                newShape.push([newX, newY])
            }
            if (!checkLeftRight(newShape)) {
                removeBoxArray() // 删除
                curShape = newShape
                drawBoxArray() // 重新绘制
            }

        }
        // 最大值
        function getLastX() {
            let lastX = 0
            for (let i = 0; i < curShape.length; i++) {
                let block = curShape[i]
                if (block[0] > lastX) {
                    lastX = block[0]
                }
            }
            return lastX
        }

        // 组合调用的方法
        function getNewBox() {
            // getRandomColor()

            randomBoxArray()
            coorX = 5
            coorY = 0
            drawBoxArray()
        }


        let lastTime = 0  // 最后一次时间
        let intervalTime = 0 // 间隔
        let animationId
        // 动画函数
        function animate(time) {
            if (!time) {
                time = 0
            }
            intervalTime += time - lastTime // 累加
            // console.log(intervalTime)
            if (intervalTime > 1000) {
                intervalTime = 0
                // 下移动
                downEvent()
            }

            lastTime = time
            // window.requestAnimationFrame(animate)

            animationId = window.requestAnimationFrame(animate);
            // console.log(animationId)

        }
        // 暂停与继续按钮
        var imgObj = document.getElementById("btn1");
        function clickPorS() {

            if (imgObj.getAttribute("src") == "../images/arrow-pause.png") {
                imgObj.src = "../images/arrow-continue.png";
                window.cancelAnimationFrame(animationId) // 暂停
            } else {
                imgObj.src = "../images/arrow-pause.png";
                animate() // 继续
            }
        }

        // 下落
        function downEvent() {
            checkForComplete()
            nowDirection = DIRECTION.DOWN
            if (isGameover()) {
                return
            }
            if (!isEnd) {
                removeBoxArray()
                coorY++
                drawBoxArray()
            }
            if (checkDown()) {
                isEnd = true
                getNewBox() // 重新生成
                nowDirection = DIRECTION.no // 方向清除
                isEnd = false
            }
        }

        // 记录满行,并删除当前
        function checkForComplete() {
            let rows = 0
            let deletionPos = 0 //最后y值的坐标
            for (let y = 0; y < canvas.height / Height; y++) {
                let completes = true // 标识位：表示填满
                for (let x = 0; x < canvas.width / Width; x++) {
                    let color = motionlessArray[x][y]
                    if (color === 0 || (typeof color === 'undefined')) {
                        completes = false
                        break;
                    } else {
                        console.log(x, y, color)
                    }
                }
                if (completes) {
                    deletionPos = y
                    rows++
                    for (let i = 0; i < canvas.width / Width; i++) {
                        if (motionlessArray[i] != undefined) {

                            motionlessArray[i][y] = 0
                            boxArrayFlag[i][y] = 0
                            let cX = boxArray[i][y].x
                            let cY = boxArray[i][y].y
                            box.fillStyle = "black";
                            box.fillRect(cX+1, cY+1, Width - 1, Height - 1)
                        } else {
                            console.log(i, y)
                        }
                    }
                }

            }
            if (rows > 0) {
                moveAllRowsDown(rows, deletionPos)
            }
        }
        // 删除满行
        function moveAllRowsDown(rows, deletionPos) {
            for (let i = deletionPos - 1; i >= 0; i--) {
                for (let x = 0; x < canvas.width / Width; x++) {
                    let prev = motionlessArray[x][i]
                    let next = motionlessArray[x][i + 1]
                    if (typeof prev === 'string') {
                        next = prev
                        boxArrayFlag[x][i + 1] = 1 // 标识为下移
                        motionlessArray[x][i + 1] = prev // 颜色为下移

                        let cX = boxArray[x][i + 1].x
                        let cY = boxArray[x][i + 1].y
                        box.fillStyle = next

                        box.fillRect(cX+1, cY+1, Width - 1, Height - 1)

                        // 重置
                        prev = 0

                        boxArrayFlag[x][i] = 0
                        motionlessArray[x][i] = 0
                        cX = boxArray[x][i].x
                        cY = boxArray[x][i].y
                        box.fillStyle = "black";
                        box.fillRect(cX+1, cY+1, Width - 1, Height - 1)
                    }
                }
            }
            // 不断的递归调用
            rows--

            if (rows >= 1) {
                moveAllRowsDown(rows, deletionPos)
            }
        }

        // 游戏结束
        function isGameover() {
            return
            let newboxArrayFlag = JSON.parse(JSON.stringify(boxArrayFlag))
            for (let j = 0; j < curShape.length; j++) {
                // 每一个小方块
                const block = curShape[j]
                let x = block[0] + coorX //第0位+默认位子
                let y = block[1] + coorY
                newboxArrayFlag[x][y] = 0 // 标识位
            }
            const last_has1 = newboxArrayFlag.some(b => b[3] == 1)
            if (last_has1) {
                alert("游戏结束")
                window.cancelAnimationFrame(animationId) // 暂停
                removeAll()
            }
            return last_has1
        }


        /*
        监听事件
        **/
        function bindClick(time) {

            this.clickCreate.onmousedown = (e) => {
                console.log("生成")
                // removeBoxArray()
                removeAll()
                getNewBox()
                animate() /// 定时器
                btn1.style.display = 'block' //显示右边 开始，暂停按钮
                imgObj.src = "../images/arrow-pause.png";

            }

            this.clickTurnLeft.onmousedown = function (e) {

                if (imgObj.getAttribute("src") == "../images/arrow-continue.png") {
                    return
                }
                console.log("左转")
                turnLShape()



            }
            this.clickTurnRight.onmousedown = function (e) {
                if (imgObj.getAttribute("src", 2) == "../images/arrow-continue.png") {
                    return
                }
                console.log("右转")
                turnRShape()

            }

            this.clickMoveLeft.onmousedown = function (e) {
                if (imgObj.getAttribute("src", 2) == "../images/arrow-continue.png") {
                    return
                }
                console.log("左移") //checkDown()
                nowDirection = DIRECTION.LEFT
                if (!checkLeftRight() && !checkDown()) {
                    removeBoxArray()
                    coorX--
                    drawBoxArray()

                }

            }
            this.clickMoveRight.onmousedown = function (e) {
                if (imgObj.getAttribute("src", 2) == "../images/arrow-continue.png") {
                    return
                }
                console.log("右移")
                nowDirection = DIRECTION.RIGHT
                if (!checkLeftRight() && !checkDown()) {
                    removeBoxArray()
                    coorX++
                    drawBoxArray()
                }
            }
            this.clickMoveDown.onmousedown = function (e) {
                if (imgObj.getAttribute("src", 2) == "../images/arrow-continue.png") {
                    return
                }
                downEvent()

            }


        }

    </script>
</body>

</html>
