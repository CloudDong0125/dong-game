<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js_软键盘</title>
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./css/index.css">

</head>

<body>
    <div class="container-body">
        <div class="login-group">
            <h1>欢迎登录</h1>
            <!--分隔符-->
            <div class="light-white"></div>

            <!--账号输入框-->
            <div class="login-input">
                <input class="input1" id="username" type="text" placeholder="请输入账号" maxlength="15" />
                <input class="input2 username" type="button" value="打开/关闭 键盘" onclick="ctrKeyboard(1)" />
            </div>

            <!--密码输入框-->
            <div class="login-input">
                <input class="input1" id="password" type="password" placeholder="请输入密码" maxlength="15" />
                <input class="input2 password" type="button" value="打开/关闭 键盘" onclick="ctrKeyboard(2)" />
            </div>

            <button id="loginBtn" onclick="loginBtn()">登 录</button>


            <div id="keyboard">
                <table cellspacing="1" width="400" onclick="keyboard()">
                    <tr>
                        <td>~</td>
                        <td>!</td>
                        <td>@</td>
                        <td>#</td>
                        <td>$</td>
                        <td>%</td>
                        <td>^</td>
                        <td>&</td>
                        <td>*</td>
                        <td>(</td>
                        <td>)</td>
                        <td>_</td>
                        <td>+</td>
                        <td>|</td>
                        <td rowspan="2" width="120" class="goback">退格</td>
                    </tr>
                    <tr>
                        <td>`</td>
                        <td class="num">1</td>
                        <td class="num">2</td>
                        <td class="num">3</td>
                        <td class="num">4</td>
                        <td class="num">5</td>
                        <td class="num">6</td>
                        <td class="num">7</td>
                        <td class="num">8</td>
                        <td class="num">9</td>
                        <td class="num">0</td>
                        <td>-</td>
                        <td>=</td>
                        <td>\</td>
                    </tr>
                    <tr>
                        <td>q</td>
                        <td>w</td>
                        <td>e</td>
                        <td>r</td>
                        <td>t</td>
                        <td>y</td>
                        <td>u</td>
                        <td>i</td>
                        <td>o</td>
                        <td>p</td>
                        <td>{</td>
                        <td>}</td>
                        <td>[</td>
                        <td>]</td>
                        <td colspan="2" class="toUptoLow">切换大/小写</td>
                    </tr>
                    <tr>
                        <td>a</td>
                        <td>s</td>
                        <td>d</td>
                        <td>f</td>
                        <td>g</td>
                        <td>h</td>
                        <td>j</td>
                        <td>k</td>
                        <td>l</td>
                        <td>:</td>
                        <td>"</td>
                        <td>;</td>
                        <td>'</td>
                        <td colspan="3" rowspan="3" class="enter">ENTER</td>
                    </tr>
                    <tr>
                        <td>z</td>
                        <td>x</td>
                        <td>c</td>
                        <td>v</td>
                        <td>b</td>
                        <td>n</td>
                        <td>m</td>
                        <td><</td>
                        <td>></td>
                        <td>?</td>
                        <td>,</td>
                        <td>.</td>
                        <td>/</td>
                    </tr>
                </table>
            </div>
        </div>



    </div>


    <script type="text/javascript" src="js/keyboard.js"></script>
</body>

</html>
